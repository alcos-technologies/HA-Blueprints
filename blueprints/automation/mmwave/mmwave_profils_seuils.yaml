blueprint:
  name: Capteur mmWave 24 GHz – profils selon seuils
  description: >
    Applique un profil de réglages au capteur de présence mmWave 24 GHz (T&H)
    selon la valeur d'un capteur choisi (température, humidité ou illuminance).


    **Logique**

    - Valeur **au-dessus** du seuil 1 → profil 1.

    - Valeur **sous** le seuil 2 → profil 2.

    - Valeur entre les deux seuils → profil « normal » (facultatif).

    - Le seuil 1 doit être plus élevé que le seuil 2. Si les plages se
      chevauchent, le profil 1 a priorité.


    Les réglages sont envoyés seulement quand la valeur **franchit** un seuil
    (et y reste pendant le délai de stabilisation), pour ménager la pile.
    Exécuter l'automatisation manuellement applique le profil correspondant à
    la valeur actuelle.


    **Compatible avec tout type de réseau** (Zigbee2MQTT, ZHA, Z-Wave, Wi-Fi,
    Matter, etc.) : on choisit directement l'entité de chaque réglage. Un
    réglage dont l'entité est laissée vide n'est pas modifié.

    - Sensibilités, délai d'absence, distance : entités `number`.

    - Anti-interférence : entité `switch` ou `select` (option ON/OFF).
  domain: automation
  homeassistant:
    min_version: 2024.10.0
  input:
    section_capteur:
      name: Capteur et appareil
      icon: mdi:radar
      input:
        source_sensor:
          name: Capteur déclencheur
          description: Capteur dont la valeur est comparée aux seuils.
          selector:
            entity:
              filter:
                - domain: sensor
                  device_class:
                    - temperature
                    - humidity
                    - illuminance
        delai:
          name: Délai de stabilisation
          description: Durée pendant laquelle la valeur doit rester au-delà du seuil.
          default:
            minutes: 2
          selector:
            duration: {}

    section_entites:
      name: Entités de réglage du capteur mmWave
      icon: mdi:tune-variant
      description: Laisser vide un réglage pour ne pas le modifier.
      input:
        ent_motion:
          name: Sensibilité mouvement (motion_detection_sensitivity)
          default: ""
          selector:
            entity:
              filter:
                - domain: number
        ent_static:
          name: Sensibilité statique (static_detection_sensitivity)
          default: ""
          selector:
            entity:
              filter:
                - domain: number
        ent_anti:
          name: Anti-interférence (anti_interference)
          default: ""
          selector:
            entity:
              filter:
                - domain:
                    - switch
                    - select
        ent_fading:
          name: Délai d'absence (fading_time)
          default: ""
          selector:
            entity:
              filter:
                - domain: number
        ent_distance:
          name: Distance de détection (detection_distance)
          default: ""
          selector:
            entity:
              filter:
                - domain: number

    section_seuil_1:
      name: Seuil 1 (au-dessus) et son profil
      icon: mdi:arrow-up-bold-circle
      input:
        seuil_1:
          name: Seuil 1
          description: Le profil 1 s'applique quand la valeur est au-dessus de ce seuil.
          default: 25
          selector:
            number:
              min: -50
              max: 100000
              step: 0.1
              mode: box
        p1_motion:
          name: Sensibilité mouvement (motion_detection_sensitivity)
          default: 7
          selector:
            number: {min: 0, max: 10, step: 1, mode: slider}
        p1_static:
          name: Sensibilité statique (static_detection_sensitivity)
          default: 7
          selector:
            number: {min: 0, max: 10, step: 1, mode: slider}
        p1_anti:
          name: Anti-interférence (anti_interference)
          default: "OFF"
          selector:
            select:
              options: ["ON", "OFF"]
        p1_fading:
          name: Délai d'absence (fading_time, s)
          default: 30
          selector:
            number: {min: 0, max: 28800, step: 1, mode: box, unit_of_measurement: s}
        p1_distance:
          name: Distance de détection (detection_distance, m)
          default: 2.04
          selector:
            number: {min: 0, max: 10, step: 0.01, mode: box, unit_of_measurement: m}

    section_seuil_2:
      name: Seuil 2 (en dessous) et son profil
      icon: mdi:arrow-down-bold-circle
      input:
        seuil_2:
          name: Seuil 2
          description: Le profil 2 s'applique quand la valeur est sous ce seuil.
          default: 15
          selector:
            number:
              min: -50
              max: 100000
              step: 0.1
              mode: box
        p2_motion:
          name: Sensibilité mouvement (motion_detection_sensitivity)
          default: 7
          selector:
            number: {min: 0, max: 10, step: 1, mode: slider}
        p2_static:
          name: Sensibilité statique (static_detection_sensitivity)
          default: 7
          selector:
            number: {min: 0, max: 10, step: 1, mode: slider}
        p2_anti:
          name: Anti-interférence (anti_interference)
          default: "OFF"
          selector:
            select:
              options: ["ON", "OFF"]
        p2_fading:
          name: Délai d'absence (fading_time, s)
          default: 30
          selector:
            number: {min: 0, max: 28800, step: 1, mode: box, unit_of_measurement: s}
        p2_distance:
          name: Distance de détection (detection_distance, m)
          default: 2.04
          selector:
            number: {min: 0, max: 10, step: 0.01, mode: box, unit_of_measurement: m}

    section_normal:
      name: Profil normal (entre les deux seuils)
      icon: mdi:restore
      collapsed: true
      input:
        normal_actif:
          name: Activer le profil normal (entre les seuils)
          default: true
          selector:
            boolean: {}
        pn_motion:
          name: Sensibilité mouvement (motion_detection_sensitivity)
          default: 7
          selector:
            number: {min: 0, max: 10, step: 1, mode: slider}
        pn_static:
          name: Sensibilité statique (static_detection_sensitivity)
          default: 7
          selector:
            number: {min: 0, max: 10, step: 1, mode: slider}
        pn_anti:
          name: Anti-interférence (anti_interference)
          default: "OFF"
          selector:
            select:
              options: ["ON", "OFF"]
        pn_fading:
          name: Délai d'absence (fading_time, s)
          default: 30
          selector:
            number: {min: 0, max: 28800, step: 1, mode: box, unit_of_measurement: s}
        pn_distance:
          name: Distance de détection (detection_distance, m)
          default: 2.04
          selector:
            number: {min: 0, max: 10, step: 0.01, mode: box, unit_of_measurement: m}

mode: restart
max_exceeded: silent

variables:
  source: !input source_sensor
  s1: !input seuil_1
  s2: !input seuil_2
  normal_actif: !input normal_actif
  ent_motion: !input ent_motion
  ent_static: !input ent_static
  ent_anti: !input ent_anti
  ent_fading: !input ent_fading
  ent_distance: !input ent_distance
  profils:
    p1:
      motion_detection_sensitivity: !input p1_motion
      static_detection_sensitivity: !input p1_static
      anti_interference: !input p1_anti
      fading_time: !input p1_fading
      detection_distance: !input p1_distance
    p2:
      motion_detection_sensitivity: !input p2_motion
      static_detection_sensitivity: !input p2_static
      anti_interference: !input p2_anti
      fading_time: !input p2_fading
      detection_distance: !input p2_distance
    normal:
      motion_detection_sensitivity: !input pn_motion
      static_detection_sensitivity: !input pn_static
      anti_interference: !input pn_anti
      fading_time: !input pn_fading
      detection_distance: !input pn_distance

triggers:
  - trigger: numeric_state
    entity_id: !input source_sensor
    below: !input seuil_1
    for: !input delai
  - trigger: numeric_state
    entity_id: !input source_sensor
    above: !input seuil_1
    for: !input delai
  - trigger: numeric_state
    entity_id: !input source_sensor
    below: !input seuil_2
    for: !input delai
  - trigger: numeric_state
    entity_id: !input source_sensor
    above: !input seuil_2
    for: !input delai

conditions: []

actions:
  - variables:
      valeur: "{{ states(source) | float(none) }}"
      zone: >
        {% set v = states(source) | float(none) %}
        {% set a = s1 | float %}
        {% set b = s2 | float %}
        {% if v is none %}aucune
        {% elif v > a %}p1
        {% elif v < b %}p2
        {% else %}normal
        {% endif %}
  - condition: template
    value_template: >
      {{ zone in ['p1', 'p2'] or (zone == 'normal' and normal_actif) }}
  - variables:
      p: "{{ profils[zone] }}"
  - if: "{{ ent_motion not in ['', none] }}"
    then:
      - action: number.set_value
        continue_on_error: true
        target:
          entity_id: "{{ ent_motion }}"
        data:
          value: "{{ p.motion_detection_sensitivity }}"
  - if: "{{ ent_static not in ['', none] }}"
    then:
      - action: number.set_value
        continue_on_error: true
        target:
          entity_id: "{{ ent_static }}"
        data:
          value: "{{ p.static_detection_sensitivity }}"
  - if: "{{ ent_fading not in ['', none] }}"
    then:
      - action: number.set_value
        continue_on_error: true
        target:
          entity_id: "{{ ent_fading }}"
        data:
          value: "{{ p.fading_time }}"
  - if: "{{ ent_distance not in ['', none] }}"
    then:
      - action: number.set_value
        continue_on_error: true
        target:
          entity_id: "{{ ent_distance }}"
        data:
          value: "{{ p.detection_distance }}"
  - if: "{{ ent_anti not in ['', none] }}"
    then:
      - choose:
          - conditions: "{{ ent_anti.startswith('switch.') }}"
            sequence:
              - action: "switch.turn_{{ 'on' if p.anti_interference == 'ON' else 'off' }}"
                continue_on_error: true
                target:
                  entity_id: "{{ ent_anti }}"
          - conditions: "{{ ent_anti.startswith('select.') }}"
            sequence:
              - variables:
                  option_anti: >
                    {% set voulu = ['on', 'true', '1', 'enable', 'enabled', 'activé']
                       if p.anti_interference == 'ON'
                       else ['off', 'false', '0', 'disable', 'disabled', 'désactivé'] %}
                    {% for o in state_attr(ent_anti, 'options') or []
                       if (o | string | lower) in voulu %}{% if loop.first %}{{ o }}{% endif %}{% endfor %}
              - if: "{{ option_anti != '' }}"
                then:
                  - action: select.select_option
                    continue_on_error: true
                    target:
                      entity_id: "{{ ent_anti }}"
                    data:
                      option: "{{ option_anti }}"
  - action: logbook.log
    data:
      name: "mmWave"
      message: >
        Profil {{ zone }} appliqué ({{ state_attr(source, 'friendly_name') }} =
        {{ valeur }}) : {{ p | to_json }}
